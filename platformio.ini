[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
; Pinned exactly (not "^7.0"): this decides the whole Arduino core/toolchain
; version, so an unpinned platform is a bigger reproducibility gap than any
; single library below. Matches what CI actually built as of this commit
; (see the "Dependency Graph" step of the "Compilar firmware" job).
platform = espressif32 @ 7.0.1
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Seeed XIAO S3 High-Spec (16MB Flash, 8MB PSRAM)
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi

; Pinned to exact versions instead of "^x.y.z" ranges: a caret range lets a
; library update silently change what a *previous* tag's release build
; compiles against, which is exactly backwards for a project whose OTA
; digests/signatures are supposed to make releases reproducible (see
; docs/plans/2026-08-23-ota-ed25519-signing-design.md). Each version here is
; what CI actually resolved and built successfully as of this commit — bump
; deliberately, not by letting a range drift.
lib_deps =
    zinggjm/GxEPD2 @ 1.6.9
    mathertel/OneButton @ 2.6.2
    bblanchon/ArduinoJson @ 6.21.6
    esphome/ESPAsyncWebServer-esphome @ 3.4.0
    esphome/AsyncTCP-esphome @ 2.1.4
    tzapu/WiFiManager @ 2.0.17
    bitbank2/unzipLIB @ 1.0.0
    https://github.com/bitbank2/bb_epaper.git#4896bae68009b3567ab4985a14880904daf7ece3
    ; Capas de EPUB (JPEG) para a biblioteca: pin por commit (tag 1.8.4) em vez
    ; de "author/Lib @ x.y.z" porque o registo do PlatformIO não estava
    ; acessível nesta sessão para confirmar a versão publicada — mesma
    ; convenção do bb_epaper/Arduino-Log acima. ONE_BIT_DITHERED faz dithering
    ; Floyd-Steinberg embutido direto para 1bpp, ver CoverImage.cpp.
    https://github.com/bitbank2/JPEGDEC.git#ae9705abeeebd057c3d0a50c1e58bdec532c76c6
    https://github.com/thijse/Arduino-Log.git#02e1d5dbd48dfbd601aaadce855c6c7a17abc5ec
    rweather/Crypto @ 0.4.0

build_flags =
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    ; Arduino-ESP32's default loopTask stack (8192 B) was overflowing on real
    ; hardware ("Stack canary watchpoint triggered (loopTask)") once a real
    ; book cover started reaching the JPEGDEC decode path (v1.19.1 cover-crash
    ; fix). JPEGDEC's own struct was moved off the stack for that same fix,
    ; but this margin stays as a safety net for the rest of the call chain
    ; (EpubLoader locals, Strings, etc.) — never tuned before because loop()
    ; never did real decode work until covers were kept end to end.
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -I include

; LittleFS filesystem - uploadfs targets the "spiffs" partition (1MB for Web UI)
; The "ebooks" partition (10MB) is mounted separately for EPUB storage
board_build.filesystem = littlefs