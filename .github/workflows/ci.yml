name: CI

# Compilação e testes em cada push para main e em cada pull request.
#
# Até aqui o único workflow era o release.yml, que corre em tags: uma regressão
# só aparecia no momento de publicar, que é precisamente quando é mais caro
# descobri-la — uma tag falhada não instala, porque o dispositivo recusa um
# asset sem digest válido.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Trabalho separado e sem toolchain: a lógica pura compila e corre em
  # segundos, por isso dá resposta mesmo que a instalação do PlatformIO
  # demore ou falhe.
  host-tests:
    name: Testes de host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correr testes de host
        run: |
          set -e
          for t in tools/tests/test_*.cpp; do
            echo "=== $t ==="
            g++ -std=c++17 -Wall -Werror -I lib/Book32_Core "$t" -o "/tmp/$(basename "$t" .cpp)"
            "/tmp/$(basename "$t" .cpp)"
          done

  build:
    name: Compilar firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Build filesystem image
        run: pio run --target buildfs

  web-ui:
    name: Sintaxe da web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A web UI é servida a partir do LittleFS tal como está: um erro de
      # sintaxe só apareceria no browser, depois de um uploadfs.
      - name: Verificar script.js
        run: node --check data/script.js

  format:
    name: Formatação (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      # git-clang-format só reformata as LINHAS alteradas por este push/PR, e
      # falha se essa reformatação mudaria alguma coisa — não verifica o
      # ficheiro inteiro. O repositório nunca foi passado pelo clang-format
      # (ver tools/format.sh), por isso um check de árvore inteira falharia
      # já no primeiro commit; isto apanha o desvio de estilo em código novo
      # sem forçar essa reformatação maior agora.
      - name: Determinar commit base
        id: base
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            echo "sha=$(git merge-base "origin/${{ github.base_ref }}" HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar formatação do código alterado
        run: |
          set +e
          # --extensions restringe aos ficheiros que este projeto trata como
          # C++ (mesmo âmbito de tools/format.sh e do "Language: Cpp" no
          # .clang-format). Sem isto, a lista de extensões por omissão do
          # git-clang-format inclui .js entre outras, e tentar formatar um
          # ficheiro nessas extensões com uma config só-C++ falha com "does
          # not support JavaScript" em vez de simplesmente ignorar o ficheiro.
          git-clang-format-18 --binary clang-format-18 --extensions cpp,h --diff "${{ steps.base.outputs.sha }}"
          STATUS=$?
          set -e
          # 0 = nada por formatar (ou nenhum .cpp/.h no diff). 1 = encontrou
          # diferenças (mostradas acima). 2 = erro da própria ferramenta.
          if [ $STATUS -ne 0 ]; then
            echo "::error::Código alterado não está formatado (ou a verificação falhou). Corre 'clang-format -i <ficheiro>' (ou tools/format.sh) e volta a submeter."
            exit 1
          fi
