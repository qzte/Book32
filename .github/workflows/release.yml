name: Release

# Builds the firmware and filesystem images and publishes them with their
# SHA-256 digests AND Ed25519 signatures in the release body.
#
# The digest and signature lines are what the device verifies before
# flashing (see lib/Book32_Core/OtaDigest.h). From v1.6.0 the device REFUSES
# to install an asset with no valid SHA-256 line; from v1.11.0 it also
# refuses one with no valid Ed25519 signature line. A release published by
# hand — without this workflow — will not install over the air.
#
# The Ed25519 signature is what actually defends against an active MITM: the
# SHA-256 digest is fetched from the same (forgeable) GitHub API response
# that supplies the download URL, but the signature requires the private key
# in the OTA_ED25519_PRIVATE_KEY secret, which this workflow is the only
# place that ever touches it. See
# docs/plans/2026-08-23-ota-ed25519-signing-design.md.
#
# Tags must be exact Semantic Versioning with a leading v: v1.6.0, not v.1.6.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run host tests
        # The encoding, ordering, versioning and digest logic is all pure and
        # host-testable. Catching a regression here is much cheaper than
        # shipping it to a device that then refuses to update.
        run: |
          set -e
          for t in tools/tests/test_*.cpp; do
            echo "=== $t ==="
            g++ -std=c++17 -Wall -I lib/Book32_Core "$t" -o /tmp/$(basename "$t" .cpp)
            /tmp/$(basename "$t" .cpp)
          done

      - name: Verify tag matches SYSTEM_VERSION
        # A mismatch here would ship a firmware that reports a different
        # version than its tag, so the device would keep re-offering the same
        # update forever.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(grep -oP '#define SYSTEM_VERSION "\K[^"]+' include/Config.h)
          echo "tag=$TAG  Config.h=$SRC"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::Tag $TAG does not match SYSTEM_VERSION $SRC in include/Config.h"
            exit 1
          fi

      - name: Build firmware
        run: pio run

      - name: Build filesystem image
        run: pio run --target buildfs

      - name: Collect artefacts
        id: collect
        run: |
          set -e
          mkdir -p dist
          cp .pio/build/seeed_xiao_esp32s3/firmware.bin dist/firmware.bin
          cp .pio/build/seeed_xiao_esp32s3/littlefs.bin dist/littlefs.bin
          ls -l dist

      - name: Compute checksums
        id: sums
        run: |
          set -e
          cd dist
          FW=$(sha256sum firmware.bin | cut -d' ' -f1)
          FS=$(sha256sum littlefs.bin | cut -d' ' -f1)
          echo "fw=$FW" >> "$GITHUB_OUTPUT"
          echo "fs=$FS" >> "$GITHUB_OUTPUT"
          echo "firmware.bin  $FW"
          echo "littlefs.bin  $FS"

      - name: Sign checksums (Ed25519)
        id: sigs
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$OTA_PRIVATE_KEY" ]; then
            echo "::error::OTA_ED25519_PRIVATE_KEY secret is not set. The device refuses to install a release with no Ed25519 signature (see lib/Book32_Core/OtaDigest.h), so this must be configured before a release can be tagged."
            exit 1
          fi

          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$OTA_PRIVATE_KEY" > "$KEY_FILE"

          # Sign the raw 32-byte SHA-256 digest (not its hex text) — the same
          # bytes the device holds after mbedtls_sha256_finish(), before it
          # ever formats them as hex. See OtaDigest.h for why signing the
          # digest instead of the whole file is safe.
          sign_asset() {
            local file="$1" out_var="$2"
            openssl dgst -sha256 -binary "dist/$file" > /tmp/digest.bin
            openssl pkeyutl -sign -inkey "$KEY_FILE" -rawin -in /tmp/digest.bin -out /tmp/sig.bin
            local hex
            hex=$(python3 -c "print(open('/tmp/sig.bin','rb').read().hex())")
            echo "${out_var}=${hex}" >> "$GITHUB_OUTPUT"
            echo "$file  $hex"
          }

          sign_asset firmware.bin fw_sig
          sign_asset littlefs.bin fs_sig

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          Book32 ${GITHUB_REF_NAME}

          Install over the air from the device web interface, or flash by USB
          with \`pio run --target upload\` and \`pio run --target uploadfs\`.

          ### Checksums

          The device verifies these before flashing and refuses to install an
          asset whose digest or signature is missing or does not match.

          \`\`\`
          SHA256 (firmware.bin) = ${{ steps.sums.outputs.fw }}
          SHA256 (littlefs.bin) = ${{ steps.sums.outputs.fs }}
          ED25519 (firmware.bin) = ${{ steps.sigs.outputs.fw_sig }}
          ED25519 (littlefs.bin) = ${{ steps.sigs.outputs.fs_sig }}
          \`\`\`
          EOF
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/firmware.bin
            dist/littlefs.bin
          body_path: notes.md
